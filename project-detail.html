<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project | CIM Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --ink:   #0f1923;
      --slate: #1e2d3d;
      --steel: #2c4a6e;
      --sky:   #1a7fc1;
      --mist:  #e8eef5;
      --cloud: #f4f7fb;
      --white: #ffffff;
      --rule:  #d0dae6;
      --text:  #243447;
      --sub:   #536070;
      --cap:   #8a9baa;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'IBM Plex Sans', sans-serif; background: var(--cloud); color: var(--text); }

    /* HEADER */
    header {
      background: var(--ink);
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px;
      position: sticky; top: 0; z-index: 200;
      border-bottom: 2px solid var(--sky);
    }
    .logo-wrap { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-badge {
      background: var(--sky); color: #fff;
      font-family: 'Playfair Display', serif;
      font-size: 14px; font-weight: 700;
      width: 38px; height: 38px; border-radius: 6px;
      display: grid; place-items: center; letter-spacing: -0.5px;
    }
    .logo-label { font-size: 16px; font-weight: 600; color: #fff; }
    .logo-label em { color: var(--sky); font-style: normal; }
    nav { display: flex; gap: 32px; }
    nav a {
      color: rgba(255,255,255,0.6); text-decoration: none;
      font-size: 13.5px; font-weight: 400; letter-spacing: 0.3px; transition: color .2s;
    }
    nav a:hover { color: #fff; }
    nav a.active { color: #fff; font-weight: 500; border-bottom: 2px solid var(--sky); padding-bottom: 2px; }

    /* BREADCRUMB */
    .breadcrumb {
      background: var(--white);
      border-bottom: 1px solid var(--rule);
      padding: 0 48px; height: 42px;
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--cap);
    }
    .breadcrumb a { color: var(--sky); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    /* HERO */
    .hero {
      background: var(--slate);
      border-bottom: 3px solid var(--sky);
      padding: 0;
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to right, rgba(15,25,35,0.92) 38%, rgba(15,25,35,0.55) 70%, rgba(15,25,35,0.2) 100%);
      z-index: 1;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      z-index: 0;
      transition: opacity 0.4s;
    }
    .hero-inner {
      position: relative; z-index: 2;
      max-width: 960px; margin: 0 auto;
      padding: 44px 48px 40px;
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 32px; align-items: center;
    }
    .hero-logo {
      width: 130px; height: 130px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      backdrop-filter: blur(6px);
      display: grid; place-items: center;
      overflow: hidden; flex-shrink: 0;
    }
    .hero-logo img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
    .hero-meta {}
    .hero-funder {
      font-size: 11px; font-weight: 600; letter-spacing: 1.6px;
      text-transform: uppercase; color: var(--sky);
      margin-bottom: 10px;
    }
    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px; color: #fff; line-height: 1.25;
      letter-spacing: -0.3px; margin-bottom: 16px;
    }
    .hero-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .hero-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.75);
      font-size: 12px; font-weight: 400;
      padding: 5px 12px; border-radius: 20px;
      backdrop-filter: blur(4px);
    }
    .hero-chip svg { opacity: 0.7; }

    /* BODY */
    .page-body {
      max-width: 960px; margin: 0 auto;
      padding: 44px 24px 80px;
      display: flex; flex-direction: column; gap: 28px;
    }

    /* SECTION CARD */
    .section-card {
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 12px;
      overflow: hidden;
      animation: fadeUp 0.45s ease both;
    }
    .section-card:nth-child(1) { animation-delay: 0.05s; }
    .section-card:nth-child(2) { animation-delay: 0.12s; }
    .section-card:nth-child(3) { animation-delay: 0.19s; }
    .section-card:nth-child(4) { animation-delay: 0.26s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .section-head {
      padding: 14px 24px;
      border-bottom: 1px solid var(--rule);
      display: flex; align-items: center; gap: 10px;
      background: var(--cloud);
    }
    .section-head h2 {
      font-family: 'Playfair Display', serif;
      font-size: 15px; font-weight: 600;
      color: var(--ink); letter-spacing: -0.1px;
    }
    .section-head svg { color: var(--sky); opacity: 0.8; flex-shrink: 0; }

    .section-body { padding: 24px; }

    /* prose */
    .prose p {
      font-size: 14.5px; line-height: 1.8;
      color: var(--sub); margin-bottom: 16px;
    }
    .prose p:last-child { margin-bottom: 0; }

    /* objectives */
    .obj-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .obj-list li {
      display: flex; align-items: flex-start; gap: 12px;
      font-size: 14px; color: var(--sub); line-height: 1.65;
    }
    .obj-num {
      flex-shrink: 0;
      width: 24px; height: 24px; border-radius: 50%;
      background: rgba(26,127,193,0.1);
      border: 1px solid rgba(26,127,193,0.25);
      display: grid; place-items: center;
      font-size: 11px; font-weight: 700;
      color: var(--sky); margin-top: 1px;
    }

    /* publications */
    .pub-list { display: flex; flex-direction: column; gap: 16px; }
    .pub-item {
      padding: 16px 18px;
      border-radius: 8px;
      border: 1px solid var(--rule);
      border-left: 3px solid var(--sky);
      background: var(--cloud);
    }
    .pub-title { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.4; margin-bottom: 5px; }
    .pub-authors { font-size: 13px; color: var(--sub); font-style: italic; margin-bottom: 5px; }
    .pub-venue { font-size: 12.5px; color: var(--cap); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .pub-link { color: var(--sky); text-decoration: none; font-weight: 500; font-style: normal; display: flex; align-items: center; gap: 4px; }
    .pub-link:hover { text-decoration: underline; }

    /* project image strip */
    .project-image {
      width: 100%; aspect-ratio: 16/9;
      object-fit: cover;
      border-bottom: 1px solid var(--rule);
      display: block;
    }

    /* back link */
    .back-bar {
      display: flex; justify-content: flex-start;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 7px;
      color: var(--sky); font-size: 13px; font-weight: 600;
      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid rgba(26,127,193,0.35);
      border-radius: 7px;
      background: var(--white);
      transition: background 0.18s, border-color 0.18s;
    }
    .back-btn:hover { background: var(--mist); border-color: var(--sky); }

    /* footer */
    footer {
      border-top: 1px solid var(--rule);
      text-align: center; padding: 28px;
      font-size: 12.5px; color: var(--cap);
    }

    @media (max-width: 640px) {
      header { padding: 0 16px; }
      nav { display: none; }
      .breadcrumb { padding: 0 16px; }
      .hero-inner { grid-template-columns: 1fr; gap: 20px; padding: 28px 16px; }
      .hero-logo { width: 90px; height: 90px; }
      .hero-title { font-size: 22px; }
      .page-body { padding: 24px 12px 60px; }
      .section-body { padding: 16px; }
    }
  </style>
</head>

    'This project aims to address these challenges by integrating artificial intelligence, fuzzy logic, and advanced signal-processing techniques into imageless MMW surveillance systems. Instead of relying on traditional image-based analysis, the proposed framework focuses on interpreting complex-valued radar signals while preserving individual privacy. The project emphasizes explainable and trustworthy AI solutions capable of operating effectively in dynamic and uncertain real-world environments.',
    'By combining complex-valued data representation with fuzzy clustering methods, the project seeks to enhance the reliability and effectiveness of concealed-object detection. The resulting surveillance framework is expected to improve public safety while maintaining ethical standards related to privacy, transparency, and responsible AI deployment.'

  objectives: [

    'The second phase focuses on designing decentralized and explainable federated learning frameworks. Multiple MMW sensing systems collaboratively train AI models without exchanging raw radar data. This distributed learning approach enhances privacy protection while enabling knowledge sharing among geographically separated surveillance systems. Explainability mechanisms are integrated to provide transparent reasoning behind detection outcomes and improve user trust in the system.',

function chip(c) {
  return `<span class="hero-chip">${c.icon} ${c.label}</span>`;
}

function render(id) {
  const p = PROJECTS[id];
  if (!p) { document.getElementById('hero-title').textContent = 'Project not found.'; return; }

  document.title = p.title + ' | CIM Lab';
  document.getElementById('bc-title').textContent = p.title.length > 60 ? p.title.slice(0, 57) + '…' : p.title;

  // Hero bg
  document.getElementById('hero-bg').style.backgroundImage = `url('${p.image}')`;

  // Hero content
  document.getElementById('hero-logo-img').src = p.logo;
  document.getElementById('hero-logo-img').alt = p.funder;
  document.getElementById('hero-funder').textContent = p.funder;
  document.getElementById('hero-title').textContent = p.title;
  document.getElementById('hero-chips').innerHTML = p.chips.map(chip).join('');

  // Project image in overview card
  const imgEl = document.getElementById('project-img');
  imgEl.src = p.image;
  imgEl.alt = p.title;

  // Overview
  document.getElementById('overview').innerHTML = p.overview.map(t => `<p>${t}</p>`).join('');

  // Objectives
  document.getElementById('objectives').innerHTML = p.objectives.map((o, i) =>
    `<li><div class="obj-num">${i + 1}</div><span>${o}</span></li>`
  ).join('');

  // Methodology
  document.getElementById('methodology').innerHTML = p.methodology.map(t => `<p>${t}</p>`).join('');

  // Publications
  document.getElementById('publications').innerHTML = p.publications.map(pub => `
    <div class="pub-item">
      <div class="pub-title">${pub.title}</div>
      <div class="pub-authors">${pub.authors}</div>
      <div class="pub-venue">
        <span>${pub.venue}</span>
        <a class="pub-link" href="${pub.url}" target="_blank">${SVG_EXT} View</a>
      </div>
    </div>`).join('');
}

const id = new URLSearchParams(window.location.search).get('id') || 'nsf-career';
render(id);
</script>
