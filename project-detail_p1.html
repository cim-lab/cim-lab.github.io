<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Detail | CIM Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,300;0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0d1b2a;
      --blue: #1a6eb5;
      --blue-light: #2485d4;
      --accent: #0aa0d6;
      --gray-bg: #f5f7fa;
      --gray-border: #dce1e9;
      --gray-mid: #8a95a3;
      --white: #ffffff;
      --text: #1c2635;
      --text-light: #4e5d6e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--gray-bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--navy);
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,.35);
    }
    .logo-area {
      display: flex; align-items: center; gap: 12px;
      text-decoration: none;
    }
    .logo-mark {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 6px;
      display: grid; place-items: center;
      font-family: 'Source Serif 4', serif;
      font-weight: 700; font-size: 16px;
      color: #fff; letter-spacing: -1px;
    }
    .logo-text { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: .3px; }
    .logo-text span { color: var(--accent); }
    nav { display: flex; gap: 28px; }
    nav a {
      color: rgba(255,255,255,.7);
      text-decoration: none; font-size: 14px; font-weight: 400;
      letter-spacing: .3px; transition: color .2s;
    }
    nav a:hover { color: #fff; }
    nav a.active { color: #fff; border-bottom: 2px solid var(--accent); padding-bottom: 2px; }

    /* ── BREADCRUMB ── */
    .breadcrumb {
      background: var(--white);
      border-bottom: 1px solid var(--gray-border);
      padding: 0 40px;
      height: 44px;
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--gray-mid);
    }
    .breadcrumb a {
      color: var(--blue); text-decoration: none;
      transition: color .15s;
    }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb svg { opacity: .5; }

    /* ── HERO BANNER ── */
    .project-hero {
      background: var(--navy);
      padding: 48px 40px 0;
      border-bottom: 3px solid var(--accent);
      position: relative;
      overflow: hidden;
    }
    .project-hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 80% 50%, rgba(10,160,214,.12) 0%, transparent 65%);
      pointer-events: none;
    }
    .hero-inner {
      max-width: 900px; margin: 0 auto;
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 32px;
      align-items: flex-start;
      position: relative;
    }
    .hero-logo {
      width: 160px; height: 160px;
      background: #1a2d40;
      border: 2px solid rgba(255,255,255,.1);
      border-radius: 12px;
      display: grid; place-items: center;
      overflow: hidden;
      flex-shrink: 0;
      margin-bottom: -3px; /* sit on the accent line */
    }
    .hero-logo img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .hero-logo .logo-placeholder-lg {
      display: grid; place-items: center;
      color: rgba(255,255,255,.25);
    }
    .hero-meta { padding-bottom: 32px; }
    .hero-tags {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .hero-tag {
      font-size: 11px; font-weight: 600;
      letter-spacing: .8px; text-transform: uppercase;
      padding: 4px 10px; border-radius: 12px;
      background: rgba(10,160,214,.18);
      color: var(--accent);
      border: 1px solid rgba(10,160,214,.3);
    }
    .hero-title {
      font-family: 'Source Serif 4', serif;
      font-size: 30px; font-weight: 700;
      color: #fff; line-height: 1.25;
      letter-spacing: -.4px;
      margin-bottom: 14px;
    }
    .hero-byline {
      display: flex; align-items: center; gap: 20px;
      flex-wrap: wrap;
    }
    .byline-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: rgba(255,255,255,.6);
    }
    .status-pill {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 600; letter-spacing: .3px;
      padding: 4px 12px; border-radius: 20px;
    }
    .pill-active   { background: rgba(26,160,100,.2); color: #4ddba0; border: 1px solid rgba(77,219,160,.25); }
    .pill-ongoing  { background: rgba(220,140,0,.18);  color: #f0aa30; border: 1px solid rgba(240,170,48,.25); }
    .pill-completed{ background: rgba(100,130,170,.18); color: #9ab3cc; border: 1px solid rgba(154,179,204,.25); }
    .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* ── MAIN LAYOUT ── */
    .page-body {
      max-width: 900px; margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ── LEFT: CONTENT ── */    .content-section {
      background: var(--white);
      border: 1px solid var(--gray-border);
      border-radius: 10px;
      overflow: hidden;
    }
    .section-header {
      padding: 14px 22px;
      border-bottom: 1px solid var(--gray-border);
      display: flex; align-items: center; gap: 10px;
    }
    .section-header h2 {
      font-family: 'Source Serif 4', serif;
      font-size: 15px; font-weight: 600;
      color: var(--navy); letter-spacing: -.1px;
    }
    .section-header svg { color: var(--blue); opacity: .7; }
    .section-body { padding: 20px 22px; }

    .prose p {
      font-size: 14.5px; line-height: 1.75;
      color: var(--text-light);
      margin-bottom: 14px;
    }
    .prose p:last-child { margin-bottom: 0; }

    /* Objectives list */
    .obj-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .obj-list li {
      display: flex; align-items: flex-start; gap: 12px;
      font-size: 14px; color: var(--text-light); line-height: 1.6;
    }
    .obj-bullet {
      flex-shrink: 0;
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(26,110,181,.1);
      display: grid; place-items: center;
      margin-top: 1px;
    }
    .obj-bullet svg { color: var(--blue); }

    /* Publications */
    .pub-list { display: flex; flex-direction: column; gap: 14px; }
    .pub-item {
      padding: 14px 16px;
      border: 1px solid var(--gray-border);
      border-left: 3px solid var(--blue);
      border-radius: 6px;
      background: var(--gray-bg);
    }
    .pub-title {
      font-size: 13.5px; font-weight: 600;
      color: var(--navy); line-height: 1.4; margin-bottom: 4px;
    }
    .pub-authors {
      font-size: 12.5px; color: var(--text-light);
      font-style: italic; margin-bottom: 4px;
    }
    .pub-venue {
      font-size: 12px; color: var(--gray-mid);
      display: flex; align-items: center; gap: 8px;
    }
    .pub-venue a {
      color: var(--blue); text-decoration: none; font-weight: 500;
      display: flex; align-items: center; gap: 4px;
      font-style: normal;
    }
    .pub-venue a:hover { color: var(--accent); }

    /* ── FOOTER ── */
    footer {
      text-align: center; padding: 28px;
      font-size: 12.5px; color: var(--gray-mid);
      border-top: 1px solid var(--gray-border);
    }

    /* ── RESPONSIVE ── */
    .page-body { display: flex; flex-direction: column; gap: 28px; }

    @media (max-width: 720px) {
      header { padding: 0 16px; }
      nav { display: none; }
      .breadcrumb { padding: 0 16px; }
      .project-hero { padding: 28px 16px 0; }
      .hero-inner { grid-template-columns: 1fr; gap: 20px; }
      .hero-logo { width: 100px; height: 100px; }
      .hero-title { font-size: 22px; }
      .page-body { padding: 24px 12px 60px; }
    }
  </style>
</head>

      'The project is funded through a combination of NSF and Texas DOT grants and builds on prior work in privacy-preserving ML, secure aggregation protocols, and urban traffic modeling.'
    ],
    objectives: [
      'Design a communication-efficient federated learning protocol tailored to heterogeneous traffic sensor networks.',
      'Develop differential-privacy-compatible gradient aggregation mechanisms that withstand inference attacks.',

      'Build an open-source reference implementation deployable by transportation agencies.',
      'Publish findings and release anonymized datasets to the research community.'
    ],
    methodology: [
      'We adopt a FedAvg-based training loop where each participant trains a local LSTM model on its own sensor streams. Gradient updates—rather than raw data—are transmitted to a trusted aggregator after being clipped and perturbed with calibrated Gaussian noise to satisfy (ε, δ)-differential privacy.',
      'Model heterogeneity across sensors (varying sampling rates, coverage areas) is handled through a novel asynchronous aggregation scheme with adaptive weighting. The aggregator never receives or stores raw sensor readings.',

  'av-safety': {
    title: 'Autonomous Vehicle Safety Verification in Mixed Traffic Environments',
    status: 'active',
    dates: '2022 – Present',
    teamCount: 3,
    tags: ['Transportation', 'AI & ML'],
    icon: `<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.2"><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 4v4h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>`,
    overview: [
      'Autonomous vehicles must make split-second decisions in scenarios never encountered during training. This project builds a comprehensive formal verification and simulation-based safety testing pipeline targeting the most hazardous edge cases: adversarial human driver behavior, pedestrian occlusion, and multi-agent interaction failures.',
      'Current AV validation methodologies rely heavily on mileage accumulation in simulation, making it impractical to cover the long tail of dangerous scenarios. We combine temporal logic model checking with adversarial reinforcement learning to generate and systematically test edge cases that conventional simulation misses.',
      'Outcomes include a publicly available safety benchmark suite, a formal specification library for AV behavioral requirements, and guidelines adopted by two regional transit authorities for AV pilot evaluation.'
    ],
    objectives: [
      'Formalize AV behavioral safety requirements using Signal Temporal Logic (STL) specifications.',
      'Develop an adversarial RL agent that generates maximally dangerous traffic scenarios within CARLA simulator.',

  'geospatial-anomaly': {

function statusPill(status) {
  const map = {
    active:    { cls: 'pill-active',    label: 'Active' },
    ongoing:   { cls: 'pill-ongoing',   label: 'Ongoing' },
    completed: { cls: 'pill-completed', label: 'Completed' }
  };
  const s = map[status] || map.ongoing;
  return `<span class="status-pill ${s.cls}"><span class="pill-dot"></span>${s.label}</span>`;
}

// ─────────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────────
function render(id) {
  const p = PROJECTS[id];
  if (!p) {
    document.getElementById('hero-title').textContent = 'Project not found.';
    document.getElementById('bc-title').textContent = 'Not Found';
    return;
  }

  // Breadcrumb
  document.getElementById('bc-title').textContent = p.title;
  document.title = p.title + ' | CIM Lab';

  // Hero icon
  document.getElementById('hero-icon').innerHTML = p.icon;

  // Tags
  document.getElementById('hero-tags').innerHTML =
    p.tags.map(t => `<span class="hero-tag">${t}</span>`).join('');

  // Title
  document.getElementById('hero-title').textContent = p.title;

  // Status pill
  document.getElementById('hero-status').outerHTML = statusPill(p.status);

  // Dates
  document.querySelector('#hero-dates span').textContent = p.dates;

  // Team count
  document.querySelector('#hero-team span').textContent = p.teamCount + ' Researchers';

  // Overview
  document.getElementById('overview').innerHTML =
    p.overview.map(para => `<p>${para}</p>`).join('');

  // Objectives
  document.getElementById('objectives').innerHTML =
    p.objectives.map(obj => `
      <li>
        <div class="obj-bullet">${SVG_CHECK}</div>
        <span>${obj}</span>
      </li>`).join('');

  // Methodology
  document.getElementById('methodology').innerHTML =
    p.methodology.map(para => `<p>${para}</p>`).join('');

  // Publications
  document.getElementById('publications').innerHTML =
    p.publications.map(pub => `
      <div class="pub-item">
        <div class="pub-title">${pub.title}</div>
        <div class="pub-authors">${pub.authors}</div>
        <div class="pub-venue">
          ${pub.venue}
          <a href="${pub.url}" target="_blank">${SVG_EXTERNAL} View</a>
        </div>
      </div>`).join('');
}
